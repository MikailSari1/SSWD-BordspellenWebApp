name: CI/CD Pipeline
  
on:
  push:
    branches: [ "release", "development" ]
  pull_request:
    branches: [ "release", "development" ]

env:
  REGISTRY: ghcr.io
  # Pakt automatisch zijn eigen gebruikersnaam en reponaam:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Tests draaien
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js (voor Tailwind)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM dependencies (Web)
        working-directory: ./Web
        run: npm install

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: dotnet test --no-build --configuration Release --verbosity normal
  # 2. Docker Image bouwen en pushen naar GHCR (alleen op release branch)
build-and-push-docker:
  name: Build & Push Docker Image
  needs: build-and-test
  if: github.event_name == 'push' && github.ref == 'refs/heads/release'
  runs-on: ubuntu-latest
  permissions:
    contents: read
    packages: write
  
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}